<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - Portfolio Wahyu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    header h1 {
      font-size: 20px;
    }

    #logoutButton {
      border: none;
      background: #ef4444;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #logoutButton:hover {
      background: #dc2626;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
      margin-bottom: 20px;
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .email {
      color: #2563eb;
      font-weight: bold;
    }

    .welcome {
      color: #6b7280;
      line-height: 1.6;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <header>
    <h1>Admin Dashboard</h1>

    <button id="logoutButton">
      Logout
    </button>
  </header>

  <main>

    <div id="loading" class="loading">
      Memeriksa login...
    </div>

    <section id="dashboard" style="display: none;">

      <div class="card">
        <h2>Selamat datang 👋</h2>

        <p class="welcome">
          Kamu berhasil masuk ke halaman admin website.
        </p>
      </div>

      <div class="card">
        <h2>Akun Admin</h2>

        <p>
          Login sebagai:
          <span id="adminEmail" class="email"></span>
        </p>
      </div>

      <div class="card">
        <h2>Panel Admin</h2>

        <p class="welcome">
          Area ini nantinya bisa kita gunakan untuk mengelola
          konten website kamu.
        </p>
      </div>

    </section>

  </main>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDikUqNXkRbe95_qiuer11dgsh6wvP_LmA",
      authDomain: "protofoliwahyu.firebaseapp.com",
      projectId: "protofoliwahyu",
      storageBucket: "protofoliwahyu.firebasestorage.app",
      messagingSenderId: "595296167838",
      appId: "1:595296167838:web:703ed6d0cada480303188f",
      measurementId: "G-XGCZEYQE13"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    const loading = document.getElementById("loading");
    const dashboard = document.getElementById("dashboard");
    const adminEmail = document.getElementById("adminEmail");
    const logoutButton = document.getElementById("logoutButton");


    // Cek status login
    onAuthStateChanged(auth, (user) => {

      if (user) {

        // User sudah login
        adminEmail.textContent = user.email;

        loading.style.display = "none";
        dashboard.style.display = "block";

      } else {

        // User belum login
        window.location.href = "/admin.html";

      }

    });


    // Logout
    logoutButton.addEventListener("click", async () => {

      try {

        await signOut(auth);

        window.location.href = "/admin.html";

      } catch (error) {

        console.error("Logout gagal:", error);

        alert("Logout gagal. Silakan coba lagi.");

      }

    });

  </script>

</body>
</html>
