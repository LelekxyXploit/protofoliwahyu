<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Portfolio Wahyu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      margin-bottom: 24px;
      color: #6b7280;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 11px 12px;
      border-radius: 9px;
      line-height: 1.4;
      font-size: 14px;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>Login Admin</h1>
    <p class="subtitle">Masuk untuk mengakses halaman administrasi website.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        placeholder="admin@email.com"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">Masuk</button>
    </form>

    <div id="message" class="message"></div>

    <a class="back" href="/">← Kembali ke website</a>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const firebaseConfig = {
  apiKey: "AIzaSyDikUqNXkRbe95_qiuer11dgsh6wvP_LmA",
  authDomain: "protofoliwahyu.firebaseapp.com",
  projectId: "protofoliwahyu",
  storageBucket: "protofoliwahyu.firebasestorage.app",
  messagingSenderId: "595296167838",
  appId: "1:595296167838:web:703ed6d0cada480303188f",
  measurementId: "G-XGCZEYQE13"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    // Kalau admin sudah login, langsung ke halaman admin.
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "/admin-dashboard.html";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      loginButton.disabled = true;
      loginButton.textContent = "Memproses...";
      message.className = "message";
      message.textContent = "";

      try {
        await signInWithEmailAndPassword(auth, email, password);

        showMessage("Login berhasil. Mengalihkan...", "success");

        setTimeout(() => {
          window.location.href = "/admin-dashboard.html";
        }, 500);

      } catch (error) {
        let text = "Login gagal. Periksa email dan password.";

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/user-not-found" ||
          error.code === "auth/wrong-password"
        ) {
          text = "Email atau password salah.";
        } else if (error.code === "auth/invalid-email") {
          text = "Format email tidak valid.";
        } else if (error.code === "auth/too-many-requests") {
          text = "Terlalu banyak percobaan. Coba lagi beberapa saat.";
        }

        showMessage(text, "error");
        loginButton.disabled = false;
        loginButton.textContent = "Masuk";
      }
    });
  </script>
</body>
</html>
